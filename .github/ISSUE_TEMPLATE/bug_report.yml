name: Bug Report
description: File a bug report to help us improve Codin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: What version of VS Code are you using?
      placeholder: e.g. 1.85.0
    validations:
      required: true
  - type: input
    id: codin-version
    attributes:
      label: Codin Version
      description: What version of the Codin extension are you using?
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: LLM Provider Used
      description: Which provider were you using when the bug occurred?
      placeholder: e.g. Claude, OpenAI, Local Ollama, Groq
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      placeholder: e.g. Windows 11, macOS Sonoma, Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open VS Code
        2. Ask the agent to...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output Panel Logs
      description: Please paste the logs from the Output panel (View -> Output -> select Codin from the dropdown).
      render: text
